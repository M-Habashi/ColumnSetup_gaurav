<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP3 real-time hybrid simulation, test sp3_r_2</title>
<style>
  :root {
    --paper: #F3F3F1; --card: #FFFFFF; --edge: #E0E0DD;
    --ink: #1C1C1C; --ink2: #545454; --muted: #878785; --faint: #DADADA; --red: #901500;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .player {
    --cw: max(min(100vw - 40px, (100svh - 270px) * 16 / 9), min(100vw - 40px, 560px));
    display: grid; grid-template-columns: var(--cw); justify-content: center; align-content: start;
    gap: 12px; padding: 20px 0; min-height: 100svh;
  }
  .player:fullscreen { background: var(--paper); align-content: center; }

  .screen {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--paper);
  }
  video { display: block; width: 100%; height: 100%; cursor: pointer; }
  .loading {
    position: absolute; inset: 0; margin: 0; display: grid; place-items: center;
    color: var(--ink2); font-size: 16px;
  }

  .deck { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 20px 16px 8px; }
  .track { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: 14px 64px 18px; column-gap: 10px; }
  .lane { justify-self: end; align-self: center; font-size: 12px; color: var(--muted); }
  .hinges { position: relative; }
  .hinges button {
    position: absolute; top: 0; width: 9px; height: 14px; margin-left: -4.5px;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .hinges button::after {
    content: ""; position: absolute; left: 3px; top: 1px; bottom: 1px; width: 3px;
    border-radius: 1px; background: var(--red); opacity: .3;
  }
  .hinges button.formed::after { opacity: 1; }
  .scrub { position: relative; cursor: pointer; touch-action: none; border-radius: 4px; }
  .scrub canvas { display: block; width: 100%; height: 100%; }
  .head { position: absolute; top: -2px; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); pointer-events: none; }
  .head::before {
    content: ""; position: absolute; top: -5px; left: -5px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--card);
  }
  .ghost { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); pointer-events: none; display: none; }
  .ghost span {
    position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap;
    padding: 1px 7px; border-radius: 4px; background: var(--ink); color: #fff; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .scrub:hover .ghost { display: block; }
  .ticks { grid-column: 2; position: relative; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; top: 2px; transform: translateX(-50%); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin: 12px 0 0 12px; }
  .play {
    width: 46px; height: 46px; display: grid; place-items: center; flex: none;
    border: 0; border-radius: 50%; background: var(--ink); color: #fff; cursor: pointer;
  }
  .play:disabled { background: var(--faint); cursor: default; }
  .clock { margin-right: auto; display: grid; line-height: 1.15; }
  .clock label { display: flex; align-items: baseline; gap: 4px; font-size: 30px; font-weight: 600; }
  .clock input {
    width: 4.6ch; padding: 0; border: 0; border-bottom: 1px dashed transparent; background: none;
    font: inherit; color: inherit; font-variant-numeric: tabular-nums; text-align: right;
  }
  .clock input:hover, .clock input:focus { border-bottom-color: var(--muted); outline: none; }
  .clock small { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group > span { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .tool {
    height: 36px; min-width: 36px; padding: 0 10px; display: grid; place-items: center;
    border: 1px solid var(--edge); border-radius: 8px; background: var(--card); cursor: pointer;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .tool:hover { border-color: var(--muted); }
  .tool[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tool:disabled { opacity: .45; cursor: default; }

  .keys { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
  kbd {
    font: inherit; font-size: 11.5px; color: var(--ink2); padding: 0 5px;
    border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 4px; background: var(--card);
  }
  @media (pointer: coarse) { .keys { display: none; } }
  @media (max-width: 640px) {
    .player { --cw: calc(100vw - 20px); padding: 10px 0; }
    .track { grid-template-columns: 0 1fr; column-gap: 0; }
    .lane { visibility: hidden; }
    .deck { padding-left: 14px; }
    .bar { margin-left: 0; }
  }
</style>
</head>

<main class="player" id="player">
  <div class="screen">
    <video id="video" playsinline aria-label="RTHS animation of test sp3_r_2"></video>

        <button class="tool" id="fwd" aria-label="Next frame" title="Next frame">

        </button>
      </div>
      <div class="group" role="group" aria-label="Playback speed" id="speeds">

        <button class="tool" data-rate="1" aria-pressed="true" title="Real earthquake speed">1×</button>
        <button class="tool" data-rate="0.5" aria-pressed="false">0.5×</button>
        <button class="tool" data-rate="0.25" aria-pressed="false">0.25×</button>
        <button class="tool" data-rate="0.1" aria-pressed="false">0.1×</button>
      </div>
      <button class="tool" id="full" aria-label="Full screen" title="Full screen">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg>
      </button>
    </div>
  </section>

  <p class="keys">
    <span><kbd>Space</kbd> play or pause</span>
    <span><kbd>←</kbd> <kbd>→</kbd> one frame</span>
    <span><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd> one second</span>
    <span><kbd>1</kbd> to <kbd>4</kbd> speed</span>
    <span><kbd>F</kbd> full screen</span>
  </p>
</main>

const v = $("video"), scrub = $("scrub"), cv = $("trace"), ctx = cv.getContext("2d"), timeIn = $("time");
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const frameNow = () => clamp(Math.floor(v.currentTime * FPS + 1e-3) - LEAD, 0, NK - 1);
const seekFrame = k => { v.currentTime = (LEAD + clamp(Math.round(k), 0, NK - 1) + 0.5) / FPS; };
const pct = t => (t / TEND * 100) + "%";

// Time axis and hinge marks
for (let t = 0; t <= TEND; t += 5) $("ticks").insertAdjacentHTML("beforeend", `<span style="left:${pct(t)}">${t}</span>`);
const marks = HINGES.map(h => {
  const b = document.createElement("button");
  b.style.left = pct(h.t);
  b.title = `${h.t.toFixed(2)} s: ${h.m.length} plastic hinges form\n${h.m.join("\n")}`;
  b.setAttribute("aria-label", `Jump to ${h.t.toFixed(2)} s, ${h.m.length} plastic hinges form`);
  b.onclick = () => { v.pause(); seekFrame(Math.ceil(h.t * FPS - 1e-6)); };
  $("hinges").append(b);
  return b;
});

// Ground motion trace, played part darker (same styling as the video's a_g panel)
const agLim = 1.12 * Math.max(...AG.map(Math.abs));
let path, pathW = 0;
function draw(tau) {
  const w = cv.clientWidth, h = cv.clientHeight, r = devicePixelRatio || 1;
  if (pathW !== w || cv.height !== Math.round(h * r)) {
    cv.width = Math.round(w * r); cv.height = Math.round(h * r); pathW = w;
    path = new Path2D();
    AG.forEach((a, i) => path.lineTo(i * DT / TEND * w, h / 2 - a / agLim * h / 2));
  }
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#ECECEA"; ctx.fillRect(0, Math.round(h / 2), w, 1);
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#DADADA"; ctx.lineWidth = 0.9; ctx.stroke(path);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, tau / TEND * w, h); ctx.clip();
  ctx.strokeStyle = "#545454"; ctx.lineWidth = 1.1; ctx.stroke(path); ctx.restore();
}

// Readouts follow whatever frame the video shows
let shown = -1;
function render(k, force) {
  if (k === shown && !force) return;
  shown = k;
  const tau = k / FPS;
  if (document.activeElement !== timeIn) timeIn.value = tau.toFixed(2);
  $("lab").textContent = `lab clock ${(tau * 20).toFixed(1)} s`;
  $("head").style.left = pct(tau);
  scrub.setAttribute("aria-valuenow", tau.toFixed(2));
  scrub.setAttribute("aria-valuetext", `${tau.toFixed(2)} seconds`);
  marks.forEach((b, i) => b.classList.toggle("formed", tau >= HINGES[i].t));
  draw(tau);
}
(function loop() { render(frameNow()); requestAnimationFrame(loop); })();
addEventListener("resize", () => render(shown, true));

// Play, pause, step, speed
const playIcon = $("playIcon");
function toggle() {
  if (!v.paused) return v.pause();
  if (frameNow() >= NK - 1) seekFrame(0);
  v.play();
}
function step(n) { v.pause(); seekFrame(frameNow() + n); }
v.onplay = () => { playIcon.setAttribute("d", "M4 2.5h3.5v13H4zM10.5 2.5H14v13h-3.5z"); $("play").setAttribute("aria-label", "Pause"); };
v.onpause = v.onended = () => { playIcon.setAttribute("d", "M5 2.5v13l11-6.5z"); $("play").setAttribute("aria-label", "Play"); };
$("play").onclick = toggle;
v.onclick = toggle;
v.ondblclick = () => fullscreen();
$("back").onclick = () => step(-1);
$("fwd").onclick = () => step(1);
const speedBtns = [...document.querySelectorAll("[data-rate]")];
function setRate(b) {
  v.playbackRate = v.defaultPlaybackRate = +b.dataset.rate;
  speedBtns.forEach(x => x.setAttribute("aria-pressed", x === b));
}
speedBtns.forEach(b => b.onclick = () => setRate(b));
function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : $("player").requestFullscreen(); }
$("full").onclick = fullscreen;

// Type a time to jump
timeIn.onfocus = () => timeIn.select();
timeIn.onkeydown = e => {
  if (e.key === "Enter") { const t = parseFloat(timeIn.value); if (!isNaN(t)) { v.pause(); seekFrame(t * FPS); } timeIn.blur(); }
  if (e.key === "Escape") timeIn.blur();
  e.stopPropagation();
};
timeIn.onblur = () => render(shown, true);

// Drag on the trace to scrub
const frameAt = x => { const r = scrub.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1) * TEND * FPS; };
let dragging = false, resume = false;
scrub.onpointerdown = e => {
  if (!v.src) return;
  dragging = true; resume = !v.paused; v.pause();
  scrub.setPointerCapture(e.pointerId); seekFrame(frameAt(e.clientX));
};
scrub.onpointermove = e => {
  const k = Math.round(frameAt(e.clientX)), g = $("ghost");
  g.style.left = pct(k / FPS); g.firstChild.textContent = `${(k / FPS).toFixed(2)} s`;
  if (dragging && !v.seeking) seekFrame(k);
};
scrub.onpointerup = scrub.onpointercancel = e => {
  if (!dragging) return;
  dragging = false; seekFrame(frameAt(e.clientX));
  if (resume) v.play();
};

// Keyboard
document.addEventListener("keydown", e => {
  if (!v.src || e.ctrlKey || e.metaKey || e.altKey) return;
  const onButton = e.target.tagName === "BUTTON";
  if ((e.key === " " || e.key === "Enter") && onButton) return;
  if (e.key === " " || e.key === "k") toggle();
  else if (e.key === "ArrowLeft") step(e.shiftKey ? -FPS : -1);
  else if (e.key === "ArrowRight") step(e.shiftKey ? FPS : 1);
  else if (e.key === "Home") step(-NK);
  else if (e.key === "End") step(NK);
  else if (e.key >= "1" && e.key <= "4") setRate(speedBtns[e.key - 1]);
  else if (e.key === "f") fullscreen();
  else return;
  e.preventDefault();
});

// Load the whole file first so scrubbing and frame steps are instant. The host
// caps files at 5 MB, so the video is published as FILE.0 ... FILE.(PARTS - 1).
(async () => {
  try {
    const parts = [];
    for (let i = 0, got = 0; i < PARTS; i++) {
      const res = await fetch(`${FILE}.${i}`);
      if (!res.ok) throw new Error(res.status);
      for (const reader = res.body.getReader(); ;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        $("loading").textContent = `Loading video, ${Math.min(99, Math.round(got / BYTES * 100))}%`;
      }
    }
    v.onloadeddata = () => { $("loading").remove(); $("play").disabled = false; seekFrame(0); };
    v.src = URL.createObjectURL(new Blob(parts, { type: "video/mp4" }));
  } catch {
    $("loading").textContent = "The video did not load. Reload the page to try again.";
  }
})();
</script>
</body>
</html>
